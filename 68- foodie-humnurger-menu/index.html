<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburger Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="images/logo.svg" alt="Logo">
    </div>

    <nav>
        <a href="/">Top Picks</a>
        <a href="/">Whopper</a>
        <a href="/">Stunner Menu</a>
        <a href="/">New Foodie Collection</a>
        <a href="/">Deal of the Day</a>
    </nav>
</header>

<main>
    <section class="hero-section">
        <div class="img-container">
            <img src="images/hero-image.png" alt="Hero Image">
        </div>
        <div class="img-container">
            <img src="images/top-picks.png" alt="Hero Image">
        </div>
        <div class="img-container">
            <img src="images/whopper.png" alt="Hero Image">
        </div>
        <div class="img-container">
            <img src="images/stunner-menu.png" alt="Hero Image">
        </div>
        <div class="img-container">
            <img src="images/foodie-collection.png" alt="Hero Image">
        </div>
        <div class="img-container">
            <img src="images/deal-of-the-day.png" alt="Hero Image">
        </div>
    </section>
</main>

</body>
</html>
