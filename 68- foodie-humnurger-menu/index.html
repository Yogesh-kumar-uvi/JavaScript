<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamburger Menu</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>

<body id="top">
    <div class="main-content">
        <!-- HEADER -->
        <header>
            <div class="header-content">
                <div class="logo">
                    <img src="images/logo.svg" alt="Logo" />
                </div>

                <div class="hamburger-menu-container">
                    <div class="hamburger-menu">
                        <span class="hamburger-icon">&#9776;</span>
                    </div>
                </div>

                <nav>
                    <span class="close-icon">&times;</span>
                    <a href="#top-picks">Top Picks</a>
                    <a href="#whopper">Whopper</a>
                    <a href="#stunner-menu">Stunner Menu</a>
                    <a href="#new-foodie-collection">New Foodie Collection</a>
                    <a href="#deal-of-the-day">Deal of the Day</a>
                </nav>
            </div>
        </header>

        <!-- MAIN -->
        <div class="main-content">
            <main>
                <section class="hero-section">
                    <div class="img-container">
                        <img src="images/hero-image.png" alt="Hero Image" />
                    </div>
                    <p>Well, You can’t resist anymore!</p>
                </section>

                <section id="top-picks" class="section">
                    <h2>Top Picks</h2>
                    <div class="img-container">
                        <img src="images/top-picks.png" alt="Top Picks" />
                    </div>
                </section>

                <section id="whopper" class="section">
                    <h2>Whopper</h2>
                    <div class="img-container">
                        <img src="images/whopper.png" alt="Whopper" />
                    </div>
                </section>

                <section id="stunner-menu" class="section">
                    <h2>Stunner Menu</h2>
                    <div class="img-container">
                        <img src="images/stunner-menu.png" alt="Stunner Menu" />
                    </div>
                </section>

                <section id="new-foodie-collection" class="section">
                    <h2>New Foodie Collection</h2>
                    <div class="img-container">
                        <img src="images/foodie-collection.png" alt="Foodie Collection" />
                    </div>
                </section>

                <section id="deal-of-the-day" class="section">
                    <h2>Deal of the Day</h2>
                    <div class="img-container">
                        <img src="images/Deal-of-the-day.png" alt="Deal of the Day" />
                    </div>
                </section>

                <!-- FOOTER -->
                <footer>
                    <h3 class="go-to-top"><a href="#top">Go to Top</a></h3>
                    <p class="footer-text">Made with ❤️ by Yogesh Kumar</p>
                </footer>
            </main>
        </div>
    </div>
</body>

</html>
