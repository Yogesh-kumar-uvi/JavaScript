<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburger Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <div class="logo">
                <img src="images/logo.svg" alt="Logo">
            </div>

            <nav>
                <span class="close-icon">&times;</span>
                <a href="#top-picks">Top Picks</a>
                <a href="#whopper">Whopper</a>
                <a href="#stunner-menu">Stunner Menu</a>
                <a href="#new-foodie-collection">New Foodie Collection</a>
                <a href="#deal-of-the-day">Deal of the Day</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="img-container">
                <img src="images/hero-image.png" alt="Hero Image">
            </div>
            <p>Well, You can’t resist anymore!</p>
        </section>

        <section id="top-picks" class="section">
            <h2>Top Picks</h2>
            <div class="img-container">
                <img src="images/top-picks.png" alt="top picks">
            </div>
        </section>

        <section id="whopper" class="section">
            <h2>Whopper</h2>
            <div class="img-container">
                <img src="images/whopper.png" alt="Burger">
            </div>
        </section>

        <section id="stunner-menu" class="section">
            <h2>Stunner Menu</h2>
            <div class="img-container">
                <img src="images/stunner-menu.png" alt="Burger">
            </div>
        </section>

        <section id="new-foodie-collection" class="section">
            <h2>New Foodie Collection</h2>
            <div class="img-container">
                <img src="images/foodie-collection.png" alt="Burger">
            </div>
        </section>

        <section id="deal-of-the-day" class="section">
            <h2>Deal of the Day</h2>
            <div class="img-container">
                <img src="images/Deal-of-the-day.png" alt="Burger">
            </div>
        </section>
        <footer>
            <h3 class="go-to-top"><a href="#">Go to Top </a></h3>
            <p class="footer-text">Made with ❤️ by Yogesh Kumar</p>
        </footer>

    </main>

</body>

</html>
