<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburger Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/logo.svg" alt="Logo">
        </div>

        <nav>
            <a href="/">Top Picks</a>
            <a href="/">Whopper</a>
            <a href="/">Stunner Menu</a>
            <a href="/">New Foodie Collection</a>
            <a href="/">Deal of the Day</a>
        </nav>
    </header>

    <main>
        <section class="hero-section">
            <div class="img-container">
                <img src="images/hero-image.png" alt="Hero Image">
            </div>
            <p>Well, You can’t resist anymore!</p>
        </section>

        <section class="section">
            <h2>Top Picks</h2>
            <div class="img-container">
                <img src="images/top-picks.png" alt="top picks">
            </div>
        </section>

        <section class="section">
            <h2>Whopper</h2>
            <div class="img-container">
                <img src="images/whopper.png" alt="Burger">
            </div>
        </section>

        <section class="section">
            <h2>Stunner Menu</h2>
            <div class="img-container">
                <img src="images/stunner-menu.png" alt="Burger">
            </div>
        </section>

        <section class="section">
            <h2>New Foodie Collection</h2>
            <div class="img-container">
                <img src="images/foodie-collection.png" alt="Burger">
            </div>
        </section>

        <section class="section">
            <h2>Deal of the Day</h2>
            <div class="img-container">
                <img src="images/Deal-of-the-day.png" alt="Burger">
            </div>
        </section>
        <button class="go-to-top-btn">Go to Top </button>
        <p>Made with  ❤️ by Yogesh Kumar</p>
    </main>

</body>

</html>
