<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickQlick</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link
        href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
        rel="stylesheet" />
</head>

<body>
    <!-- Start Screen -->
    <div class="start-screen active">
        <div class="start-content">
            <div class="start-image-container">
                <img src="Group 4 (1).png" alt="Quiz Time" class="start-image">
            </div>
            <button class="btn-start">Start Quiz</button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div class="quiz-screen">
        <header>
            <h1 class="logo">QuickQlick</h1>
            
        </header>

        <div class="qs-count" id="qs-count" style="display: none;">
            <span class="qs-answered">01</span> / <span class="total-qs">20</span>
        </div>



        <!-- Quiz Interface (initially hidden) -->
        <div class="quiz-interface" id="quiz-interface" style="display: none;">
            <div class="qs-bg">
                <div class="qs-container">
                    <!-- Question text injected here -->
                </div>
            </div>
        </div>

        <div class="timer-bg" id="timer-bg" style="display: none;">
            <div class="timer">00:<span>30</span></div>
        </div>

        <div class="options-container-bg" id="options-container-bg" style="display: none;">
            <div class="options-container">
                <div class="option option1">
                    <span class="option-text"></span>
                    
                    <div class="wrong-ans-container">

                    
                    </div>
                </div>
                <div class="option option2">
                    <span class="option-text"></span>
                    
                    <div class="wrong-ans-container">

                        
                    </div>
                </div>
                <div class="option option3">
                    <span class="option-text"></span>
                    
                    <div class="wrong-ans-container">

                        
                    </div>
                </div>
                <div class="option option4">
                    <span class="option-text"></span>
                    
                    <div class="wrong-ans-container">

                        
                    </div>
                </div>
            </div>
        </div>

        <footer id="quiz-footer" style="display: none;">
            <svg class="play-or-pause-btn" viewBox="0 0 24 24" id="play-pause-btn">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>

            <div class="btn-next btn">Next ></div>
            <div class="btn-see-your-result btn">See your result ></div>
        </footer>

    </div>

    <!-- Result Screen -->
    <div class="result-modal" id="result-modal">
        <div class="result-content">
            <div class="start-image-container" style="transform: scale(0.8);">
                <img src="https://i.ibb.co/db0Cj52/Image.png" alt="Quiz Time" class="result-image">
            </div>
            <h2>Quiz Completed!</h2>
            <p>Your Score:</p>
            <div class="result-score" id="result-score">0/20</div>
            <button class="btn-restart" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    
</body>

</html>
